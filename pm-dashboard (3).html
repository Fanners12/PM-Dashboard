<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PM Dashboard">
<meta name="theme-color" content="#0a0f1a">
<title>PM Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#080c14;--surface:#0d1220;--surface2:#121828;--border:#1a2440;--green:#2dff7a;--amber:#ffcc00;--red:#ff3030;--blue:#00e5ff;--orange:#ff6b00;--text:#b8cce0;--text-dim:#4a6080;--sans:'Barlow Condensed',sans-serif;--mono:'Share Tech Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
.header-left h1{font-size:1.5rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#fff;line-height:1}
.header-left h1 span{color:var(--blue)}
.header-left p{font-family:var(--mono);font-size:.6rem;color:var(--text-dim);margin-top:2px;letter-spacing:.1em}
.header-right{display:flex;gap:7px;align-items:center}
.btn{font-family:var(--sans);font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;padding:6px 13px;border-radius:5px;border:none;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--blue);color:#000}.btn-primary:hover{background:#33eeff}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}
.btn-danger{background:transparent;border:1px solid var(--red);color:var(--red)}.btn-danger:hover{background:rgba(255,48,48,.1)}
.btn-green{background:var(--green);color:#000}.btn-green:hover{background:#5dff99}
.stats-bar{display:flex;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto}
.stat-item{flex:1;min-width:70px;padding:8px 10px;text-align:center;border-right:1px solid var(--border)}
.stat-item:last-child{border-right:none}
.stat-num{font-family:var(--mono);font-size:1.4rem;font-weight:700;line-height:1;display:block}
.stat-num.green{color:var(--green)}.stat-num.amber{color:var(--amber)}.stat-num.red{color:var(--red)}.stat-num.blue{color:var(--blue)}
.stat-lbl{font-size:.58rem;font-family:var(--mono);color:var(--text-dim);letter-spacing:.08em;text-transform:uppercase;margin-top:2px;display:block}
main{padding:12px 14px 80px;max-width:1200px;margin:0 auto}
.view-tabs{display:flex;gap:3px;margin-bottom:12px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:3px}
.view-tab{flex:1;padding:6px;text-align:center;font-family:var(--sans);font-weight:700;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;cursor:pointer;color:var(--text-dim);transition:all .15s;border:none;background:transparent}
.view-tab.active{background:var(--blue);color:#000}
.filter-bar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.filter-btn{font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;transition:all .15s}
.filter-btn.active{border-color:var(--blue);color:var(--blue);background:rgba(0,229,255,.08)}
.machine-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.machine-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:border-color .2s}
.machine-card:hover{border-color:var(--blue)}
.machine-card.status-green{border-left:4px solid var(--green)}
.machine-card.status-amber{border-left:4px solid var(--amber)}
.machine-card.status-red{border-left:4px solid var(--red)}
.card-header{padding:10px 12px 8px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.card-icon{font-size:1.2rem;flex-shrink:0}
.card-title-wrap{flex:1;min-width:0}
.card-name{font-size:1rem;font-weight:700;color:#fff;letter-spacing:.04em;text-transform:uppercase;line-height:1.2}
.card-type{font-family:var(--mono);font-size:.58rem;color:var(--text-dim);margin-top:1px;letter-spacing:.06em}
.status-pill{font-family:var(--mono);font-size:.55rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:99px;font-weight:700;white-space:nowrap;flex-shrink:0}
.pill-green{background:rgba(45,255,122,.15);color:var(--green);border:1px solid rgba(45,255,122,.3)}
.pill-amber{background:rgba(255,204,0,.15);color:var(--amber);border:1px solid rgba(255,204,0,.3)}
.pill-red{background:rgba(255,48,48,.15);color:var(--red);border:1px solid rgba(255,48,48,.3)}
.card-body{padding:10px 12px}
.pm-info{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}
.pm-info-label{font-family:var(--mono);font-size:.54rem;color:var(--text-dim);letter-spacing:.08em;text-transform:uppercase}
.pm-info-value{font-size:.88rem;font-weight:700;color:var(--text);margin-top:1px}
.pm-info-value.hr{color:var(--red)}.pm-info-value.ha{color:var(--amber)}.pm-info-value.hg{color:var(--green)}
.days-bar{margin-bottom:9px}
.days-bar-label{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.54rem;color:var(--text-dim);margin-bottom:3px}
.days-track{height:4px;background:var(--border);border-radius:99px;overflow:hidden}
.days-fill{height:100%;border-radius:99px;transition:width .4s}
.fill-green{background:var(--green)}.fill-amber{background:var(--amber)}.fill-red{background:var(--red)}
.card-notes{font-size:.7rem;color:var(--text-dim);margin-bottom:8px;padding:4px 7px;background:var(--bg);border-radius:4px;border-left:2px solid var(--border);font-style:italic;line-height:1.4}
.card-actions{display:flex;gap:5px;flex-wrap:wrap}
.card-actions .btn{flex:1;font-size:.7rem;padding:5px 6px}
.empty-state{text-align:center;padding:50px 20px;grid-column:1/-1}
.empty-state .icon{font-size:2.5rem;margin-bottom:10px;opacity:.4}
.empty-state h3{font-size:1.1rem;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px}
.empty-state p{font-size:.82rem;color:var(--text-dim);margin-bottom:14px}
/* History */
.history-list{display:flex;flex-direction:column;gap:7px}
.history-item{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:9px 12px;display:flex;align-items:center;gap:10px}
.history-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.history-content{flex:1;min-width:0}
.history-title{font-size:.88rem;font-weight:700;color:var(--text)}
.history-meta{font-family:var(--mono);font-size:.58rem;color:var(--text-dim);margin-top:2px}
.history-tech{font-family:var(--mono);font-size:.6rem;color:var(--blue);white-space:nowrap}
/* Calendar */
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-header{text-align:center;font-family:var(--mono);font-size:.56rem;color:var(--text-dim);padding:5px 2px;letter-spacing:.05em}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:.7rem;font-weight:600}
.cal-day.other-month{color:var(--text-dim);opacity:.3}
.cal-day.today{background:rgba(0,229,255,.15);color:var(--blue);font-weight:900}
.cal-day.has-pm{background:rgba(255,204,0,.15);color:var(--amber)}
.cal-day.has-pm.overdue{background:rgba(255,48,48,.15);color:var(--red)}
.cal-day.has-pm.done{background:rgba(45,255,122,.15);color:var(--green)}
.cal-month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-month-nav h3{font-size:.95rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.cal-nav-btn{background:none;border:1px solid var(--border);color:var(--text);border-radius:4px;padding:3px 9px;cursor:pointer;font-size:.78rem}
.cal-nav-btn:hover{border-color:var(--blue);color:var(--blue)}
.cal-legend{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:.58rem;color:var(--text-dim)}
.legend-dot{width:7px;height:7px;border-radius:2px}
/* Graphs */
.graphs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:12px}
.graph-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px}
.graph-title{font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.graph-title span{font-family:var(--mono);font-size:.58rem;color:var(--text-dim);font-weight:400;text-transform:none;letter-spacing:0}
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut-legend{display:flex;flex-direction:column;gap:6px}
.donut-legend-item{display:flex;align-items:center;gap:7px;font-size:.8rem;font-weight:600}
.donut-legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.donut-legend-val{font-family:var(--mono);font-size:.72rem;color:var(--text-dim)}
.bar-chart{display:flex;flex-direction:column;gap:7px}
.bar-row{display:flex;align-items:center;gap:8px}
.bar-label{font-family:var(--mono);font-size:.58rem;color:var(--text-dim);width:90px;flex-shrink:0;text-overflow:ellipsis;overflow:hidden;white-space:nowrap;text-align:right}
.bar-track{flex:1;height:18px;background:var(--border);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;display:flex;align-items:center;padding-left:6px;transition:width .6s ease;min-width:2px}
.bar-val{font-family:var(--mono);font-size:.56rem;color:rgba(0,0,0,.8);font-weight:700;white-space:nowrap}
.sparkline-wrap{position:relative}
.sparkline-labels{display:flex;justify-content:space-between;margin-top:4px}
.sparkline-label{font-family:var(--mono);font-size:.55rem;color:var(--text-dim)}
.no-data-msg{font-family:var(--mono);font-size:.65rem;color:var(--text-dim);text-align:center;padding:20px}
.gauge-wrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.gauge-pct{font-family:var(--mono);font-size:2rem;font-weight:700;color:var(--green);line-height:1}
.gauge-pct.warn{color:var(--amber)}.gauge-pct.bad{color:var(--red)}
.gauge-sub{font-family:var(--mono);font-size:.6rem;color:var(--text-dim)}
.gauge-bar-track{width:100%;height:8px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:8px}
.gauge-bar-fill{height:100%;border-radius:99px;transition:width .6s}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(4px)}
.modal-overlay.hidden{display:none}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto}
.modal-header{padding:14px 16px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-header h2{font-size:1rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#fff}
.modal-close{background:none;border:none;color:var(--text-dim);font-size:1.1rem;cursor:pointer;padding:4px}
.modal-close:hover{color:var(--red)}
.modal-body{padding:14px 16px}
.form-group{margin-bottom:12px}
.form-label{font-family:var(--mono);font-size:.6rem;color:var(--text-dim);letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:4px}
.form-input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--sans);font-size:.95rem;font-weight:600;padding:7px 11px;border-radius:5px;outline:none}
.form-input:focus{border-color:var(--blue)}
select.form-input{cursor:pointer}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-footer{padding:10px 16px 14px;border-top:1px solid var(--border);display:flex;gap:7px;justify-content:flex-end}
.issues-list{display:flex;flex-direction:column;gap:5px;margin-top:5px}
.issue-item{display:flex;gap:7px;align-items:center}
.issue-item input[type="text"]{flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--sans);font-size:.85rem;padding:5px 9px;border-radius:4px;outline:none}
.issue-item input:focus{border-color:var(--blue)}
.remove-issue{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:1rem;padding:2px}
.remove-issue:hover{color:var(--red)}
.add-issue-btn{font-family:var(--mono);font-size:.6rem;color:var(--blue);background:none;border:1px dashed rgba(0,229,255,.3);border-radius:4px;padding:4px 12px;cursor:pointer;width:100%;margin-top:3px;letter-spacing:.08em}
.add-issue-btn:hover{background:rgba(0,229,255,.05)}
@media(max-width:500px){.machine-grid{grid-template-columns:1fr}.graphs-grid{grid-template-columns:1fr}.form-row{grid-template-columns:1fr}header{padding:9px 12px}main{padding:10px 10px 80px}.bar-label{width:70px}}
</style>

<body>
<header>
  <div class="header-left">
    <h1>PM <span>DASHBOARD</span></h1>
    <p id="headerDate">// REAL-TIME MAINTENANCE TRACKER</p>
  </div>
  <div class="header-right">
    <button class="btn btn-primary" onclick="openAddMachine()">+ Machine</button>
  </div>
</header>
<div class="stats-bar">
  <div class="stat-item"><span class="stat-num blue" id="statTotal">0</span><span class="stat-lbl">Machines</span></div>
  <div class="stat-item"><span class="stat-num green" id="statGood">0</span><span class="stat-lbl">OK</span></div>
  <div class="stat-item"><span class="stat-num amber" id="statDue">0</span><span class="stat-lbl">Due Soon</span></div>
  <div class="stat-item"><span class="stat-num red" id="statOverdue">0</span><span class="stat-lbl">Overdue</span></div>
  <div class="stat-item"><span class="stat-num blue" id="statPmsMonth">0</span><span class="stat-lbl">This Month</span></div>
</div>
<main>
  <div class="view-tabs">
    <button class="view-tab active" onclick="showView('dashboard')" id="tab-dashboard">Dashboard</button>
    <button class="view-tab" onclick="showView('graphs')" id="tab-graphs">Graphs</button>
    <button class="view-tab" onclick="showView('history')" id="tab-history">History</button>
    <button class="view-tab" onclick="showView('calendar')" id="tab-calendar">Calendar</button>
  </div>
  <!-- Dashboard -->
  <div id="view-dashboard">
    <div class="filter-bar">
      <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
      <button class="filter-btn" onclick="setFilter('Rotovap',this)">🧪 Rotovaps</button>
      <button class="filter-btn" onclick="setFilter('Torvac Vacuum Furnace',this)">🔥 Torvacs</button>
      <button class="filter-btn" onclick="setFilter('Attritor Mill',this)">⚙️ Mills</button>
      <button class="filter-btn" onclick="setFilter('overdue',this)">🔴 Overdue</button>
    </div>
    <div class="machine-grid" id="machineGrid"></div>
  </div>
  <!-- Graphs -->
  <div id="view-graphs" style="display:none">
    <div class="graphs-grid">
      <div class="graph-card">
        <div class="graph-title">Fleet Status <span>current</span></div>
        <div class="donut-wrap"><svg id="donutSvg" width="110" height="110" viewBox="0 0 110 110"></svg><div class="donut-legend" id="donutLegend"></div></div>
      </div>
      <div class="graph-card">
        <div class="graph-title">PM Compliance <span>all time</span></div>
        <div class="gauge-wrap" id="complianceGauge"></div>
      </div>
      <div class="graph-card" style="grid-column:1/-1">
        <div class="graph-title">Days Since Last PM <span>per machine</span></div>
        <div class="bar-chart" id="daysSinceChart"></div>
      </div>
      <div class="graph-card" style="grid-column:1/-1">
        <div class="graph-title">PM Activity <span>last 6 months</span></div>
        <div class="sparkline-wrap"><svg id="sparklineSvg" width="100%" height="80" style="display:block"></svg><div class="sparkline-labels" id="sparklineLabels"></div></div>
      </div>
      <div class="graph-card" style="grid-column:1/-1">
        <div class="graph-title">Issues Per Machine <span>all time</span></div>
        <div class="bar-chart" id="issuesChart"></div>
      </div>
    </div>
  </div>
  <!-- History -->
  <div id="view-history" style="display:none"><div class="history-list" id="historyList"></div></div>
  <!-- Calendar -->
  <div id="view-calendar" style="display:none">
    <div class="cal-month-nav">
      <button class="cal-nav-btn" onclick="changeMonth(-1)">◀</button>
      <h3 id="calMonthLabel"></h3>
      <button class="cal-nav-btn" onclick="changeMonth(1)">▶</button>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
    <div class="cal-legend">
      <div class="legend-item"><div class="legend-dot" style="background:rgba(45,255,122,.4)"></div>Done</div>
      <div class="legend-item"><div class="legend-dot" style="background:rgba(255,204,0,.4)"></div>Due</div>
      <div class="legend-item"><div class="legend-dot" style="background:rgba(255,48,48,.4)"></div>Overdue</div>
      <div class="legend-item"><div class="legend-dot" style="background:rgba(0,229,255,.4)"></div>Today</div>
    </div>
  </div>
</main>
<!-- Add/Edit Machine Modal -->
<div class="modal-overlay hidden" id="machineModal">
  <div class="modal">
    <div class="modal-header"><h2 id="modalTitle">Add Machine</h2><button class="modal-close" onclick="closeModal('machineModal')">✕</button></div>
    <div class="modal-body">
      <input type="hidden" id="editMachineId">
      <div class="form-group"><label class="form-label">Machine Name</label><input type="text" class="form-input" id="machineName" placeholder="e.g. Rotovap 1"></div>
      <div class="form-group"><label class="form-label">Machine Type</label>
        <select class="form-input" id="machineType">
          <option value="Rotovap">Rotovap</option>
          <option value="Torvac Vacuum Furnace">Torvac Vacuum Furnace</option>
          <option value="Attritor Mill">Attritor Mill</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">PM Frequency</label>
          <select class="form-input" id="pmFrequency">
            <option value="7">Weekly</option><option value="14">Fortnightly</option>
            <option value="30" selected>Monthly</option><option value="90">Quarterly</option>
            <option value="180">6 Monthly</option><option value="365">Yearly</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">Last PM Date</label><input type="date" class="form-input" id="lastPmDate"></div>
      </div>
      <div class="form-group"><label class="form-label">Checklist URL</label><input type="text" class="form-input" id="checklistUrl" placeholder="https://fanners12.github.io/..."></div>
      <div class="form-group"><label class="form-label">Notes</label><input type="text" class="form-input" id="machineNotes" placeholder="Location, details..."></div>
    </div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('machineModal')">Cancel</button><button class="btn btn-primary" onclick="saveMachine()">Save</button></div>
  </div>
</div>
<!-- Log PM Modal -->
<div class="modal-overlay hidden" id="logPmModal">
  <div class="modal">
    <div class="modal-header"><h2 id="logPmTitle">Log PM</h2><button class="modal-close" onclick="closeModal('logPmModal')">✕</button></div>
    <div class="modal-body">
      <input type="hidden" id="logPmMachineId">
      <div class="form-row">
        <div class="form-group"><label class="form-label">PM Date</label><input type="date" class="form-input" id="logPmDate"></div>
        <div class="form-group"><label class="form-label">Technician</label><input type="text" class="form-input" id="logPmTech" placeholder="Name"></div>
      </div>
      <div class="form-group"><label class="form-label">Result</label>
        <select class="form-input" id="logPmResult">
          <option value="pass">All Clear</option><option value="issues">Issues Found</option><option value="partial">Partial</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">Issues / Notes</label>
        <div class="issues-list" id="issuesList"></div>
        <button class="add-issue-btn" onclick="addIssueField()">+ Add Issue</button>
      </div>
    </div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('logPmModal')">Cancel</button><button class="btn btn-green" onclick="saveLog()">Log PM Complete</button></div>
  </div>
</div>
<script>
const ICONS={'Rotovap':'🧪','Torvac Vacuum Furnace':'🔥','Attritor Mill':'⚙️','Other':'🏭'};
const CHECKLIST_URLS={'Rotovap':'https://fanners12.github.io/Rotovap-Checks/','Torvac Vacuum Furnace':'https://fanners12.github.io/Torvac-Checks/','Attritor Mill':'https://fanners12.github.io/Attritor-Checks/'};
const COLORS=['#00e5ff','#2dff7a','#ffcc00','#ff6b00','#c77dff','#ff3030','#33eeff','#5dff99','#ffa0a0'];
let calMonth=new Date(), activeFilter='all';

// Shared data layer
const DB={
  getMachines:()=>JSON.parse(localStorage.getItem('pm_machines')||'[]'),
  getHistory:()=>JSON.parse(localStorage.getItem('pm_history')||'[]'),
  save:(m,h)=>{localStorage.setItem('pm_machines',JSON.stringify(m));localStorage.setItem('pm_history',JSON.stringify(h))},
};

function seed(){
  if(DB.getMachines().length>0)return;
  const t=new Date(),ago=d=>{const x=new Date(t);x.setDate(t.getDate()-d);return x.toISOString().split('T')[0]};
  const m=[
    {id:'r1',name:'Rotovap 1',type:'Rotovap',frequency:30,lastPm:ago(25),checklistUrl:CHECKLIST_URLS['Rotovap'],notes:'Unit 1'},
    {id:'r2',name:'Rotovap 2',type:'Rotovap',frequency:30,lastPm:ago(28),checklistUrl:CHECKLIST_URLS['Rotovap'],notes:'Unit 2'},
    {id:'r3',name:'Rotovap 3',type:'Rotovap',frequency:30,lastPm:ago(20),checklistUrl:CHECKLIST_URLS['Rotovap'],notes:'Unit 3'},
    {id:'r4',name:'Rotovap 4',type:'Rotovap',frequency:30,lastPm:ago(32),checklistUrl:CHECKLIST_URLS['Rotovap'],notes:'Unit 4'},
    {id:'r5',name:'Rotovap 5',type:'Rotovap',frequency:30,lastPm:ago(15),checklistUrl:CHECKLIST_URLS['Rotovap'],notes:'Unit 5'},
    {id:'t1',name:'Torvac 1',type:'Torvac Vacuum Furnace',frequency:30,lastPm:ago(35),checklistUrl:CHECKLIST_URLS['Torvac Vacuum Furnace'],notes:'Furnace 1'},
    {id:'t2',name:'Torvac 2',type:'Torvac Vacuum Furnace',frequency:30,lastPm:ago(22),checklistUrl:CHECKLIST_URLS['Torvac Vacuum Furnace'],notes:'Furnace 2'},
    {id:'t3',name:'Torvac 3',type:'Torvac Vacuum Furnace',frequency:30,lastPm:ago(10),checklistUrl:CHECKLIST_URLS['Torvac Vacuum Furnace'],notes:'Furnace 3'},
    {id:'t4',name:'Torvac 4',type:'Torvac Vacuum Furnace',frequency:30,lastPm:ago(38),checklistUrl:CHECKLIST_URLS['Torvac Vacuum Furnace'],notes:'Furnace 4'},
    {id:'t5',name:'Torvac 5',type:'Torvac Vacuum Furnace',frequency:30,lastPm:ago(14),checklistUrl:CHECKLIST_URLS['Torvac Vacuum Furnace'],notes:'Furnace 5'},
    {id:'t6',name:'Torvac 6',type:'Torvac Vacuum Furnace',frequency:30,lastPm:ago(27),checklistUrl:CHECKLIST_URLS['Torvac Vacuum Furnace'],notes:'Furnace 6'},
    {id:'t7',name:'Torvac 7',type:'Torvac Vacuum Furnace',frequency:30,lastPm:ago(5),checklistUrl:CHECKLIST_URLS['Torvac Vacuum Furnace'],notes:'Furnace 7'},
    {id:'t8',name:'Torvac 8',type:'Torvac Vacuum Furnace',frequency:30,lastPm:ago(33),checklistUrl:CHECKLIST_URLS['Torvac Vacuum Furnace'],notes:'Furnace 8'},
    {id:'a1',name:'Attritor Mill 1',type:'Attritor Mill',frequency:30,lastPm:ago(10),checklistUrl:CHECKLIST_URLS['Attritor Mill'],notes:'27.4kg TC balls'},
    {id:'a2',name:'Attritor Mill 2',type:'Attritor Mill',frequency:30,lastPm:ago(32),checklistUrl:CHECKLIST_URLS['Attritor Mill'],notes:'27.4kg TC balls'},
    {id:'a3',name:'Attritor Mill 3',type:'Attritor Mill',frequency:30,lastPm:ago(18),checklistUrl:CHECKLIST_URLS['Attritor Mill'],notes:'27.4kg TC balls'},
    {id:'a4',name:'Attritor Mill 4',type:'Attritor Mill',frequency:30,lastPm:ago(5),checklistUrl:CHECKLIST_URLS['Attritor Mill'],notes:'27.4kg TC balls'},
    {id:'a5',name:'Attritor Mill 5',type:'Attritor Mill',frequency:30,lastPm:ago(38),checklistUrl:CHECKLIST_URLS['Attritor Mill'],notes:'27.4kg TC balls'},
  ];
  DB.save(m,[]);
}

function getDays(m){
  if(!m.lastPm)return{daysSince:null,daysUntil:null,status:'red'};
  const last=new Date(m.lastPm);last.setHours(0,0,0,0);
  const today=new Date();today.setHours(0,0,0,0);
  const daysSince=Math.floor((today-last)/86400000);
  const daysUntil=m.frequency-daysSince;
  return{daysSince,daysUntil,status:daysUntil<0?'red':daysUntil<=7?'amber':'green'};
}

function fmtDate(s){if(!s)return'Never';return new Date(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}
function genId(){return'machine_'+Date.now()}

function setFilter(f,btn){
  activeFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderDashboard();
}

function renderDashboard(){
  let machines=DB.getMachines();
  if(activeFilter==='overdue') machines=machines.filter(m=>getDays(m).status==='red');
  else if(activeFilter!=='all') machines=machines.filter(m=>m.type===activeFilter);
  const grid=document.getElementById('machineGrid');
  if(!machines.length){
    grid.innerHTML=`<div class="empty-state"><div class="icon">🏭</div><h3>${activeFilter==='all'?'No machines yet':'No machines in this category'}</h3><p>${activeFilter==='all'?'Add your first machine':''}</p>${activeFilter==='all'?'<button class="btn btn-primary" onclick="openAddMachine()">+ Add Machine</button>':''}</div>`;
    updateStats();return;
  }
  grid.innerHTML=machines.map(m=>{
    const{daysSince,daysUntil,status}=getDays(m);
    const icon=ICONS[m.type]||'🏭';
    const pillCls=status==='green'?'pill-green':status==='amber'?'pill-amber':'pill-red';
    const pillTxt=status==='red'?'OVERDUE':status==='amber'?'DUE SOON':'UP TO DATE';
    const pct=Math.min(100,daysSince!==null?(daysSince/m.frequency)*100:0);
    const fillCls=status==='green'?'fill-green':status==='amber'?'fill-amber':'fill-red';
    const dueText=daysUntil===null?'—':daysUntil<0?`${Math.abs(daysUntil)}d overdue`:daysUntil===0?'Today':`${daysUntil}d`;
    const dueCls=status==='red'?'hr':status==='amber'?'ha':'hg';
    const notesHtml=m.notes?`<div class="card-notes">${m.notes}</div>`:'';
    const chkUrl=m.checklistUrl||(CHECKLIST_URLS[m.type]||'');
    const chkBtn=chkUrl?`<button class="btn btn-ghost" onclick="openChecklist('${m.id}','${chkUrl}')">📋 PM</button>`:'';
    return`<div class="machine-card status-${status}">
      <div class="card-header">
        <span class="card-icon">${icon}</span>
        <div class="card-title-wrap"><div class="card-name">${m.name}</div><div class="card-type">${m.type} · ${m.frequency}d</div></div>
        <span class="status-pill ${pillCls}">${pillTxt}</span>
      </div>
      <div class="card-body">
        <div class="pm-info">
          <div><div class="pm-info-label">Last PM</div><div class="pm-info-value">${fmtDate(m.lastPm)}</div></div>
          <div><div class="pm-info-label">Next Due</div><div class="pm-info-value ${dueCls}">${dueText}</div></div>
          <div><div class="pm-info-label">Days Since</div><div class="pm-info-value">${daysSince!==null?daysSince+'d':'—'}</div></div>
          <div><div class="pm-info-label">Frequency</div><div class="pm-info-value">${m.frequency}d</div></div>
        </div>
        <div class="days-bar">
          <div class="days-bar-label"><span>Last PM</span><span>Due</span></div>
          <div class="days-track"><div class="days-fill ${fillCls}" style="width:${pct}%"></div></div>
        </div>
        ${notesHtml}
        <div class="card-actions">
          <button class="btn btn-green" onclick="openLogPm('${m.id}')">✓ Log PM</button>
          ${chkBtn}
          <button class="btn btn-ghost" onclick="openEditMachine('${m.id}')">✏</button>
          <button class="btn btn-danger" onclick="deleteMachine('${m.id}')">🗑</button>
        </div>
      </div>
    </div>`;
  }).join('');
  updateStats();
}

function updateStats(){
  const machines=DB.getMachines();
  let good=0,due=0,overdue=0;
  machines.forEach(m=>{const{status}=getDays(m);if(status==='green')good++;else if(status==='amber')due++;else overdue++;});
  const now=new Date();
  const pmsMonth=DB.getHistory().filter(h=>{const d=new Date(h.date);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()}).length;
  document.getElementById('statTotal').textContent=machines.length;
  document.getElementById('statGood').textContent=good;
  document.getElementById('statDue').textContent=due;
  document.getElementById('statOverdue').textContent=overdue;
  document.getElementById('statPmsMonth').textContent=pmsMonth;
}

function openChecklist(machineId, url){
  // Pass machine ID to checklist via URL param so it can pre-select the machine
  window.open(url+'?machine='+machineId,'_blank');
}

// Graphs
function renderGraphs(){
  const machines=DB.getMachines(),history=DB.getHistory();
  // Donut
  let g=0,a=0,r=0;
  machines.forEach(m=>{const{status}=getDays(m);if(status==='green')g++;else if(status==='amber')a++;else r++;});
  const total=machines.length||1;
  const cx=55,cy=55,rv=38,stroke=14,circ=2*Math.PI*rv;
  const segs=[{val:g,color:'#2dff7a',label:'Up to date'},{val:a,color:'#ffcc00',label:'Due soon'},{val:r,color:'#ff3030',label:'Overdue'}];
  let offset=0,paths='';
  segs.forEach(s=>{const pct=s.val/total,dash=pct*circ,gap=circ-dash;paths+=`<circle cx="${cx}" cy="${cy}" r="${rv}" fill="none" stroke="${s.color}" stroke-width="${stroke}" stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})" opacity=".9"/>`;offset+=dash;});
  document.getElementById('donutSvg').innerHTML=paths+`<text x="${cx}" y="${cy+2}" text-anchor="middle" font-family="Share Tech Mono,monospace" font-size="16" font-weight="700" fill="#fff">${machines.length}</text><text x="${cx}" y="${cy+14}" text-anchor="middle" font-family="Share Tech Mono,monospace" font-size="7" fill="#4a6080">TOTAL</text>`;
  document.getElementById('donutLegend').innerHTML=segs.map(s=>`<div class="donut-legend-item"><div class="donut-legend-dot" style="background:${s.color}"></div>${s.label} <span class="donut-legend-val">${s.val}</span></div>`).join('');
  // Gauge
  const onTime=history.filter(h=>h.result!=='partial').length;
  const pct=history.length>0?Math.round((onTime/history.length)*100):100;
  const gcls=pct>=80?'':pct>=60?'warn':'bad';
  const fc=pct>=80?'var(--green)':pct>=60?'var(--amber)':'var(--red)';
  document.getElementById('complianceGauge').innerHTML=`<div class="gauge-pct ${gcls}">${pct}%</div><div class="gauge-sub">PM completion rate (${onTime}/${history.length})</div><div class="gauge-bar-track"><div class="gauge-bar-fill" style="width:${pct}%;background:${fc}"></div></div><div style="display:flex;justify-content:space-between;margin-top:4px;font-family:var(--mono);font-size:.55rem;color:var(--text-dim)"><span>0%</span><span>100%</span></div>`;
  // Days since bar
  const maxD=Math.max(...machines.map(m=>getDays(m).daysSince||0),1);
  document.getElementById('daysSinceChart').innerHTML=machines.map((m,i)=>{
    const{daysSince,status}=getDays(m);
    const p=Math.min(100,((daysSince||0)/Math.max(maxD,m.frequency))*100);
    const c=status==='green'?'#2dff7a':status==='amber'?'#ffcc00':'#ff3030';
    return`<div class="bar-row"><div class="bar-label" title="${m.name}">${m.name}</div><div class="bar-track"><div class="bar-fill" style="width:${p}%;background:${c}"><span class="bar-val">${daysSince!==null?daysSince+'d':'-'}</span></div></div></div>`;
  }).join('');
  // Sparkline
  const now=new Date();
  const months=Array.from({length:6},(_,i)=>{const d=new Date(now.getFullYear(),now.getMonth()-5+i,1);return{label:d.toLocaleDateString('en-GB',{month:'short'}),year:d.getFullYear(),month:d.getMonth()}});
  const counts=months.map(m=>history.filter(h=>{const d=new Date(h.date);return d.getMonth()===m.month&&d.getFullYear()===m.year}).length);
  const maxC=Math.max(...counts,1);
  const svg=document.getElementById('sparklineSvg');
  const W=svg.parentElement.offsetWidth||300,H=80,pad=20;
  const pts=counts.map((c,i)=>[pad+(i/(months.length-1))*(W-2*pad),H-pad-(c/maxC)*(H-2*pad)]);
  const poly=pts.map(p=>p.join(',')).join(' ');
  const area=`${pad},${H-pad} `+pts.map(p=>p.join(',')).join(' ')+` ${W-pad},${H-pad}`;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.innerHTML=`<defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#00e5ff" stop-opacity=".3"/><stop offset="100%" stop-color="#00e5ff" stop-opacity=".02"/></linearGradient></defs><polygon points="${area}" fill="url(#sg)"/><polyline points="${poly}" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#00e5ff"/><text x="${p[0]}" y="${p[1]-8}" text-anchor="middle" font-family="Share Tech Mono,monospace" font-size="9" fill="#00e5ff">${counts[i]}</text>`).join('')}`;
  document.getElementById('sparklineLabels').innerHTML=months.map(m=>`<span class="sparkline-label">${m.label}</span>`).join('');
  // Issues chart
  const issData=machines.map(m=>({name:m.name,count:history.filter(h=>h.machineId===m.id&&h.issues&&h.issues.filter(i=>i).length>0).length})).sort((a,b)=>b.count-a.count);
  const maxI=Math.max(...issData.map(x=>x.count),1);
  document.getElementById('issuesChart').innerHTML=issData.map((m,i)=>{const p=(m.count/maxI)*100;const c=COLORS[i%COLORS.length];return`<div class="bar-row"><div class="bar-label" title="${m.name}">${m.name}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(p,2)}%;background:${c}"><span class="bar-val">${m.count}</span></div></div></div>`;}).join('');
}

// History
function renderHistory(){
  const history=DB.getHistory();
  const list=document.getElementById('historyList');
  if(!history.length){list.innerHTML=`<div class="empty-state"><div class="icon">📋</div><h3>No history yet</h3><p>Log a completed PM to see it here</p></div>`;return;}
  const sorted=[...history].sort((a,b)=>new Date(b.date)-new Date(a.date));
  list.innerHTML=sorted.map(h=>{
    const dotColor=h.result==='pass'?'var(--green)':h.result==='partial'?'var(--amber)':'var(--red)';
    const rl=h.result==='pass'?'✓ All Clear':h.result==='partial'?'⚠ Partial':'✕ Issues';
    const iss=h.issues&&h.issues.filter(i=>i).length>0?`<br>${h.issues.filter(i=>i).map(i=>`<span style="font-size:.7rem;color:var(--amber)">• ${i}</span>`).join('<br>')}`:''
    return`<div class="history-item"><div class="history-dot" style="background:${dotColor}"></div><div class="history-content"><div class="history-title">${h.machineName} — ${rl}</div><div class="history-meta">${fmtDate(h.date)}${iss}</div></div><div class="history-tech">${h.tech||'—'}</div></div>`;
  }).join('');
}

// Calendar
function renderCalendar(){
  const today=new Date();today.setHours(0,0,0,0);
  const year=calMonth.getFullYear(),month=calMonth.getMonth();
  document.getElementById('calMonthLabel').textContent=calMonth.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const firstDay=new Date(year,month,1),lastDay=new Date(year,month+1,0);
  let startDow=firstDay.getDay();if(startDow===0)startDow=7;
  const dueDates={},doneDates={};
  DB.getMachines().forEach(m=>{
    if(!m.lastPm)return;
    const last=new Date(m.lastPm);last.setHours(0,0,0,0);
    const due=new Date(last);due.setDate(due.getDate()+m.frequency);
    const key=due.toISOString().split('T')[0];
    if(!dueDates[key])dueDates[key]=[];dueDates[key].push(m.name);
  });
  DB.getHistory().forEach(h=>{if(!doneDates[h.date])doneDates[h.date]=[];doneDates[h.date].push(h.machineName);});
  const days=['Mo','Tu','We','Th','Fr','Sa','Su'];
  let html=days.map(d=>`<div class="cal-header">${d}</div>`).join('');
  for(let i=1;i<startDow;i++)html+=`<div class="cal-day other-month"></div>`;
  for(let d=1;d<=lastDay.getDate();d++){
    const dateObj=new Date(year,month,d);dateObj.setHours(0,0,0,0);
    const dateStr=dateObj.toISOString().split('T')[0];
    const isToday=dateObj.getTime()===today.getTime();
    const isDue=dueDates[dateStr],isDone=doneDates[dateStr],isOver=isDue&&dateObj<today;
    let cls='cal-day';
    if(isToday)cls+=' today';
    if(isDone)cls+=' has-pm done';
    else if(isDue&&isOver)cls+=' has-pm overdue';
    else if(isDue)cls+=' has-pm';
    const title=isDone?doneDates[dateStr].join(', '):isDue?'Due: '+dueDates[dateStr].join(', '):'';
    html+=`<div class="${cls}" title="${title}">${d}</div>`;
  }
  document.getElementById('calendarGrid').innerHTML=html;
}
function changeMonth(dir){calMonth.setMonth(calMonth.getMonth()+dir);renderCalendar();}

// Views
function showView(view){
  ['dashboard','graphs','history','calendar'].forEach(v=>{
    document.getElementById(`view-${v}`).style.display=v===view?'':'none';
    const tab=document.getElementById(`tab-${v}`);
    if(tab)tab.classList.toggle('active',v===view);
  });
  if(view==='dashboard')renderDashboard();
  if(view==='graphs')renderGraphs();
  if(view==='history')renderHistory();
  if(view==='calendar')renderCalendar();
}

// Add/Edit
function openAddMachine(){
  document.getElementById('modalTitle').textContent='Add Machine';
  document.getElementById('editMachineId').value='';
  ['machineName','machineNotes','checklistUrl'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('machineType').value='Rotovap';
  document.getElementById('pmFrequency').value='30';
  document.getElementById('lastPmDate').value=new Date().toISOString().split('T')[0];
  document.getElementById('machineModal').classList.remove('hidden');
}
function openEditMachine(id){
  const machines=DB.getMachines(),m=machines.find(x=>x.id===id);if(!m)return;
  document.getElementById('modalTitle').textContent='Edit Machine';
  document.getElementById('editMachineId').value=m.id;
  document.getElementById('machineName').value=m.name;
  document.getElementById('machineType').value=m.type;
  document.getElementById('pmFrequency').value=m.frequency;
  document.getElementById('lastPmDate').value=m.lastPm||'';
  document.getElementById('checklistUrl').value=m.checklistUrl||'';
  document.getElementById('machineNotes').value=m.notes||'';
  document.getElementById('machineModal').classList.remove('hidden');
}
function saveMachine(){
  const id=document.getElementById('editMachineId').value;
  const name=document.getElementById('machineName').value.trim();
  if(!name){alert('Please enter a machine name');return;}
  const type=document.getElementById('machineType').value;
  const data={id:id||genId(),name,type,frequency:parseInt(document.getElementById('pmFrequency').value),lastPm:document.getElementById('lastPmDate').value,checklistUrl:document.getElementById('checklistUrl').value.trim()||CHECKLIST_URLS[type]||'',notes:document.getElementById('machineNotes').value.trim()};
  const machines=DB.getMachines();
  if(id){const idx=machines.findIndex(x=>x.id===id);if(idx>=0)machines[idx]=data;}
  else machines.push(data);
  DB.save(machines,DB.getHistory());
  closeModal('machineModal');renderDashboard();
}
function deleteMachine(id){
  if(!confirm('Delete this machine?'))return;
  const machines=DB.getMachines().filter(m=>m.id!==id);
  DB.save(machines,DB.getHistory());renderDashboard();
}

// Log PM
function openLogPm(id){
  const m=DB.getMachines().find(x=>x.id===id);if(!m)return;
  document.getElementById('logPmTitle').textContent=`Log PM — ${m.name}`;
  document.getElementById('logPmMachineId').value=id;
  document.getElementById('logPmDate').value=new Date().toISOString().split('T')[0];
  document.getElementById('logPmTech').value='';
  document.getElementById('logPmResult').value='pass';
  document.getElementById('issuesList').innerHTML='';
  document.getElementById('logPmModal').classList.remove('hidden');
}
function addIssueField(){
  const item=document.createElement('div');item.className='issue-item';
  item.innerHTML=`<input type="text" placeholder="Describe the issue..."><button class="remove-issue" onclick="this.parentElement.remove()">✕</button>`;
  document.getElementById('issuesList').appendChild(item);
}
function saveLog(){
  const id=document.getElementById('logPmMachineId').value;
  const machines=DB.getMachines(),m=machines.find(x=>x.id===id);if(!m)return;
  const date=document.getElementById('logPmDate').value;
  const tech=document.getElementById('logPmTech').value.trim();
  const result=document.getElementById('logPmResult').value;
  const issues=Array.from(document.querySelectorAll('#issuesList input')).map(i=>i.value.trim()).filter(Boolean);
  m.lastPm=date;
  const history=DB.getHistory();
  history.unshift({id:'log_'+Date.now(),machineId:id,machineName:m.name,date,tech,result,issues});
  DB.save(machines,history);
  closeModal('logPmModal');renderDashboard();
}

function closeModal(id){document.getElementById(id).classList.add('hidden');}
document.querySelectorAll('.modal-overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.add('hidden');}));

// Auto-refresh every 30 seconds to pick up updates from checklist apps
setInterval(()=>{if(document.visibilityState==='visible')renderDashboard();},30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')renderDashboard();});

document.getElementById('headerDate').textContent='// '+new Date().toLocaleDateString('en-GB',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).toUpperCase();
seed();
renderDashboard();
</script>
